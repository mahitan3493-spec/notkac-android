name: NotKac Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NOTKAC-ANDROID-v0.1-WEBVIEW.zip"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v3

      - name: Kaynak paketi ac
        run: |
          unzip -q NOTKAC-ANDROID-v0.1-WEBVIEW.zip

      - name: Gradle yetkisi ver
        run: |
          chmod +x NOTKAC-ANDROID-v0.1-WEBVIEW/gradlew

      - name: APK derle
        run: |
          cd NOTKAC-ANDROID-v0.1-WEBVIEW
          ./gradlew --no-daemon assembleDebug

      - name: APK dosyasini hazirla
        run: |
          cp NOTKAC-ANDROID-v0.1-WEBVIEW/app/build/outputs/apk/debug/app-debug.apk NotKac-v0.1-debug.apk

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NotKac-v0.1-APK
          path: NotKac-v0.1-debug.apk
          retention-days: 14
