name: NotKac Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NOTKAC-ANDROID-v0.1-WEBVIEW.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK paketlerini hazirla
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Kaynak paketi ac
        run: |
          unzip -q NOTKAC-ANDROID-v0.1-WEBVIEW.zip

      - name: APK derle
        run: |
          cd NOTKAC-ANDROID-v0.1-WEBVIEW
          gradle --no-daemon assembleDebug

      - name: APK dosyasini hazirla
        run: |
          cp NOTKAC-ANDROID-v0.1-WEBVIEW/app/build/outputs/apk/debug/app-debug.apk NotKac-v0.1-debug.apk

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: NotKac-v0.1-APK
          path: NotKac-v0.1-debug.apk
          retention-days: 14
