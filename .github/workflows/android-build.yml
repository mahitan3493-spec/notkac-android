name: NotKac Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NOTKAC-ANDROID-v0.1-WEBVIEW.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK hazirla
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -1)
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Kaynak paketini ac
        run: |
          unzip -q NOTKAC-ANDROID-v0.1-WEBVIEW.zip

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTKAC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOTKAC_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::NOTKAC_KEYSTORE_BASE64 ve NOTKAC_KEYSTORE_PASSWORD GitHub Actions secrets olarak tanimlanmali."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notkac-release.jks"

      - name: Surum bilgisini al
        id: version
        run: |
          cd NOTKAC-ANDROID-v0.1-WEBVIEW
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2; exit}' app/build.gradle)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Release APK derle
        env:
          NOTKAC_KEYSTORE_PATH: ${{ runner.temp }}/notkac-release.jks
          NOTKAC_KEYSTORE_PASSWORD: ${{ secrets.NOTKAC_KEYSTORE_PASSWORD }}
        run: |
          cd NOTKAC-ANDROID-v0.1-WEBVIEW
          gradle --no-daemon clean assembleRelease

      - name: APK dosyasini hazirla
        run: |
          cp NOTKAC-ANDROID-v0.1-WEBVIEW/app/build/outputs/apk/release/app-release.apk \
          "NotKac-v${{ steps.version.outputs.version }}.apk"

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: NotKac-v${{ steps.version.outputs.version }}-APK
          path: NotKac-v${{ steps.version.outputs.version }}.apk
          retention-days: 14

      - name: GitHub Release yayinla
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "NotKac-v$VERSION.apk" --clobber
          else
            gh release create "$TAG" "NotKac-v$VERSION.apk" \
              --title "NotKaç v$VERSION" \
              --notes "NotKaç Android v$VERSION. Uygulama yeni sürümleri otomatik olarak kontrol eder."
          fi
